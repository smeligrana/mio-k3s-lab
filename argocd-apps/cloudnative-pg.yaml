apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/smeligrana/mio-k3s-lab.git
    targetRevision: main
    path: cloudnative-pg
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudnative-pg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
